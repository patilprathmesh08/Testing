# ─── SonarCloud Project Configuration ───────────────────────────────────────
# Version: v7
# Date: 24-07-2026
# File location: CNR-Motor-Driver-1.0/sonar-project.properties
#
# CONFIRMED (via actual CI run errors) path resolution behavior - this is
# NOT uniform across properties, each is resolved by a different sensor:
#   - sonar.sources                      -> relative to projectBaseDir
#   - sonar.coverageReportPaths          -> relative to projectBaseDir
#   - sonar.cfamily.compile-commands     -> relative to repo root (NOT
#                                            projectBaseDir) - handled by
#                                            the CFamily plugin's own reader
# Do not "simplify" these to be consistent without testing again - this
# inconsistency is real scanner behavior, not a mistake.

# Organisation and project details
sonar.organization=patilprathmesh08
sonar.projectKey=patilprathmesh08_Testing
sonar.projectName=stmTesting
sonar.projectVersion=1.0

# Source code location - relative to THIS file's folder (CNR-Motor-Driver-1.0/)
sonar.sources=Src
sonar.inclusions=**/*.c,**/*.h

# Language
sonar.language=c
sonar.c.file.suffixes=.c
sonar.h.file.suffixes=.h

# Encoding
sonar.sourceEncoding=UTF-8

# Exclude build output, third party folders, and the ARM toolchain
sonar.exclusions=**/build/**,**/MCSDK_v6.4.2-Full/**,**/Drivers/CMSIS/**,**/arm-gnu-toolchain-**/**

# Build Wrapper output - NOTE: unlike sonar.sources, this CFamily-specific
# path resolves relative to the scanner's OS working directory (repo root),
# NOT relative to projectBaseDir. So it needs the full prefix even though
# sonar.sources does not. Confirmed via CI error message 24-07-2026.
sonar.cfamily.compile-commands=CNR-Motor-Driver-1.0/build-wrapper-output/compile_commands.json

# Quality gate - do not fail build if quality gate fails
sonar.qualitygate.wait=false

# Coverage report - resolves relative to projectBaseDir (same as
# sonar.sources), UNLIKE sonar.cfamily.compile-commands above which
# resolves relative to the repo root. Confirmed via CI error message
# 24-07-2026 (doubled CNR-Motor-Driver-1.0 in the path when prefixed).
sonar.coverageReportPaths=unit_tests/build/coverage-sonarqube.xml
