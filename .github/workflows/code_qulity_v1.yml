name: STM32 Motor Controller CI - Option A (Docker Action)

on:
  push:
    branches: [main, MotorCode]
  pull_request:
    branches: [main, MotorCode]

jobs:
  build-and-analyze:
    name: Build and Analyze STM32G431 (Option A)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # CHANGED: toolchain now extracted INSIDE the workspace, not $HOME,
      # so it is visible to the Docker container the Sonar action spawns.
      - name: Install ARM GCC Toolchain 14.3.1
        run: |
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz
          tar xf arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz -C $GITHUB_WORKSPACE
          echo "$GITHUB_WORKSPACE/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi/bin" >> $GITHUB_PATH
          rm arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz

      - name: Verify ARM GCC Version
        run: arm-none-eabi-gcc --version

      - name: Install Ninja
        run: sudo apt-get install -y ninja-build

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.27'

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Install Sonar Build Wrapper
        run: |
          wget -q https://sonarcloud.io/static/cpp/build-wrapper-linux-x86.zip
          unzip -q build-wrapper-linux-x86.zip
          echo "$PWD/build-wrapper-linux-x86" >> $GITHUB_PATH
          rm build-wrapper-linux-x86.zip

      - name: Configure CMake (Debug)
        working-directory: CNR-Motor-Driver-1.0
        run: cmake --preset Debug

      - name: Build Debug Firmware with Build Wrapper
        working-directory: CNR-Motor-Driver-1.0
        run: |
          build-wrapper-linux-x86-64 \
            --out-dir build-wrapper-output \
            cmake --build --preset Debug

      # CHANGED: now also fixes the toolchain path, not just the source path,
      # since the compiler itself must resolve inside the Docker container too.
      - name: Fix Build Wrapper Paths for SonarCloud
        working-directory: CNR-Motor-Driver-1.0
        run: |
          sed -i 's|/home/runner/work/Testing/Testing/CNR-Motor-Driver-1.0|/github/workspace/CNR-Motor-Driver-1.0|g' \
            build-wrapper-output/compile_commands.json
          sed -i "s|$GITHUB_WORKSPACE/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi|/github/workspace/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi|g" \
            build-wrapper-output/compile_commands.json
          echo "Paths fixed"
          head -3 build-wrapper-output/compile_commands.json

      - name: Configure CMake (Release)
        working-directory: CNR-Motor-Driver-1.0
        run: cmake --preset Release

      - name: Build Release Firmware
        working-directory: CNR-Motor-Driver-1.0
        run: cmake --build --preset Release

      - name: Debug Sonar Paths
        run: |
          echo "== Src folder check =="
          ls -la CNR-Motor-Driver-1.0/Src | head -5
          echo "== compile_commands.json sample =="
          head -c 500 CNR-Motor-Driver-1.0/build-wrapper-output/compile_commands.json

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
