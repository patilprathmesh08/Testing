name: STM32 CNR Motor Controller CI Pipeline

# CI runs on push / PR to poc and motor_param_tunning, or manually with "Run workflow".
on:
  workflow_dispatch:          # manual run: build any branch already on GitHub
  push:
    branches:
      - main
      - MotorCode
  pull_request:
    branches:
      - poc
      - motor_param_tunning

# ─── PROJECT FOLDER (set once, used everywhere) ────────────────────────────────
# Folder in the repository that contains CMakeLists.txt and CMakePresets.json.
env:
  PROJECT_DIR: CnrMotorCnt

jobs:
  # ─── JOB 1: BUILD FIRMWARE ──────────────────────────────────────────────────
  # Tool versions match the developer PC: ARM GCC 15.2.1, CMake 4.3.1, Ninja 1.13.2
  build:
    name: Build CNR motor controller Firmware
    runs-on: ubuntu-latest

    steps:
      # Step 1 - Checkout the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2 - Stop early with a clear message if PROJECT_DIR is wrong
      - name: Check Project Folder
        run: |
          if [ ! -f "$PROJECT_DIR/CMakePresets.json" ]; then
            echo "ERROR: '$PROJECT_DIR/CMakePresets.json' not found. Folders in repo:"
            ls -la
            exit 1
          fi
          echo "OK: using project folder '$PROJECT_DIR'"

      # Step 3 - Install Arm GNU Toolchain 15.2.rel1 (same as the PC)
      - name: Install ARM GCC Toolchain
        run: |
          TC="arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi"
          wget -q "https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/${TC}.tar.xz"
          tar -xf "${TC}.tar.xz" -C "$HOME"
          echo "$HOME/${TC}/bin" >> "$GITHUB_PATH"    # put arm-none-eabi-gcc on PATH for next steps

      # Step 4 - Install Ninja 1.13.2 (same as the PC)
      - name: Install Ninja
        run: |
          wget -q "https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux.zip"
          unzip -q ninja-linux.zip -d "$HOME/ninja"
          echo "$HOME/ninja" >> "$GITHUB_PATH"

      # Step 5 - Install CMake 4.3.1 (same as the PC)
      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.3.1'

      # Step 6 - Print tool versions and stop if any of them does not match the PC
      - name: Check Tool Versions
        run: |
          arm-none-eabi-gcc --version
          ninja --version
          cmake --version
          FAIL=0
          arm-none-eabi-gcc --version | head -1 | grep -q " 15.2.1 " || { echo "ERROR: ARM GCC is not 15.2.1"; FAIL=1; }
          [ "$(ninja --version)" = "1.13.2" ]                         || { echo "ERROR: Ninja is not 1.13.2"; FAIL=1; }
          cmake --version | head -1 | grep -q " 4.3.1$"               || { echo "ERROR: CMake is not 4.3.1"; FAIL=1; }
          if [ "$FAIL" -ne 0 ]; then exit 1; fi
          echo "OK: tool versions match the developer PC"

      # Step 7 - Configure and build Debug firmware (CMakeLists.txt also creates the .bin)
      - name: Build Debug Firmware
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cmake --preset Debug
          cmake --build --preset Debug
          ls -l build/Debug/CnrMotorCnt.elf build/Debug/CnrMotorCnt.bin

      # Step 8 - Build Release firmware (compile check only, not uploaded)
      - name: Build Release Firmware
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cmake --preset Release
          cmake --build --preset Release

      # Step 9 - Upload Debug firmware (.elf for debugging, .bin for flashing)
      - name: Upload Debug Firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-debug
          path: |
            ${{ env.PROJECT_DIR }}/build/Debug/CnrMotorCnt.elf
            ${{ env.PROJECT_DIR }}/build/Debug/CnrMotorCnt.bin
          if-no-files-found: error
          retention-days: 7

  # ─── JOB 2: DOXYGEN DOCUMENTATION ───────────────────────────────────────────
  # Runs in parallel with build job
  doxygen:
    name: Doxygen Documentation
    runs-on: ubuntu-latest

    steps:
      # Step 1 - Checkout the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2 - Install Doxygen (graphviz draws the call/include graphs)
      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      # Step 3 - Use the project Doxyfile, or create a default one for our own code only
      - name: Setup Doxyfile
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f Doxyfile ]; then
            echo "No Doxyfile found, generating default..."
            doxygen -g Doxyfile
            sed -i 's/PROJECT_NAME           = "My Project"/PROJECT_NAME           = "CnrMotorCnt"/' Doxyfile
            sed -i 's|INPUT                  =|INPUT                  = Src Inc application/Src application/Inc|' Doxyfile
            sed -i 's/RECURSIVE              = NO/RECURSIVE              = YES/' Doxyfile
            sed -i 's/EXTRACT_ALL            = NO/EXTRACT_ALL            = YES/' Doxyfile
            sed -i 's/GENERATE_LATEX         = YES/GENERATE_LATEX         = NO/' Doxyfile
            sed -i 's|OUTPUT_DIRECTORY       =|OUTPUT_DIRECTORY       = doxygen_docs|' Doxyfile
          fi

      # Step 4 - Generate the documentation (warnings are shown in this step's log, not fatal)
      - name: Run Doxygen
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          doxygen Doxyfile 2>&1 | tee doxygen_output.log
          WARNINGS=$(grep -c "warning:" doxygen_output.log || true)
          echo "---"
          echo "Doxygen Warnings: $WARNINGS"
          if [ "$WARNINGS" -gt 0 ]; then
            echo "WARNING: $WARNINGS Doxygen warning(s) found - see the output above"
          else
            echo "PASSED: No Doxygen warnings found."
          fi

      # Step 5 - Upload the generated HTML documentation
      - name: Upload Doxygen HTML
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-html
          path: ${{ env.PROJECT_DIR }}/doxygen_docs/html
          if-no-files-found: error
          retention-days: 7
