name: STM32 Motor Controller CI Pipeline

on:
  push:
    branches:
      - main
      - MotorCode
  pull_request:
    branches:
      - main
      - MotorCode

# ─── PROJECT FOLDER (set once, used everywhere) ────────────────────────────────
# Folder in the repository that contains CMakeLists.txt and CMakePresets.json.
env:
  PROJECT_DIR: CnrMotorCnt

jobs:
  # ─── JOB 1: BUILD FIRMWARE ──────────────────────────────────────────────────
  build:
    name: Build STM32G431 Firmware
    runs-on: ubuntu-latest

    steps:
      # Step 1 - Checkout the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2 - Stop early with a clear message if PROJECT_DIR is wrong
      - name: Check Project Folder
        run: |
          if [ ! -f "$PROJECT_DIR/CMakePresets.json" ]; then
            echo "ERROR: '$PROJECT_DIR/CMakePresets.json' not found. Folders in repo:"
            ls -la
            exit 1
          fi
          echo "OK: using project folder '$PROJECT_DIR'"

      # Step 3 - Install ARM GCC Toolchain and Ninja
      - name: Install ARM GCC Toolchain and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi ninja-build

      # Step 4 - Install CMake
      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.27'

      # Step 5 - Print tool versions (useful when a build breaks)
      - name: Tool Versions
        run: |
          arm-none-eabi-gcc --version
          ninja --version
          cmake --version

      # Step 6 - Configure and build Debug firmware
      - name: Build Debug Firmware
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cmake --preset Debug
          cmake --build --preset Debug

      # Step 7 - Configure and build Release firmware
      - name: Build Release Firmware
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cmake --preset Release
          cmake --build --preset Release

      # Step 8 - Upload Debug ELF artifact
      - name: Upload Debug ELF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-debug
          path: ${{ env.PROJECT_DIR }}/build/Debug/**/*.elf
          if-no-files-found: error
          retention-days: 7

      # Step 9 - Upload Release ELF artifact
      - name: Upload Release ELF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-release
          path: ${{ env.PROJECT_DIR }}/build/Release/**/*.elf
          if-no-files-found: error
          retention-days: 7

  # ─── JOB 2: CODE QUALITY CHECKS ─────────────────────────────────────────────
  # Runs in parallel with build job
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      # Step 1 - Checkout code (full history for SonarCloud)
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2 - Stop early with a clear message if PROJECT_DIR is wrong
      - name: Check Project Folder
        run: |
          for dir in Src Inc application/Src application/Inc; do
            if [ ! -d "$PROJECT_DIR/$dir" ]; then
              echo "ERROR: '$PROJECT_DIR/$dir' not found."
              exit 1
            fi
          done
          echo "OK: using project folder '$PROJECT_DIR'"

      # Step 3 - Install Doxygen, ARM GCC and Ninja
      # (ARM GCC + Ninja are needed only to generate compile_commands.json for SonarCloud)
      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz gcc-arm-none-eabi binutils-arm-none-eabi ninja-build

      # Step 4 - Install CMake
      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.27'

      # ─── CHECK 1: HEADER AND COPYRIGHT NOTICE (WARNING ONLY) ────────────────
      # Only checks our own code - skips Drivers/, Middlewares/ and MCSDK/
      - name: Check File Headers and Copyright Notice
        run: |
          echo "Checking copyright headers in Src, Inc and application only..."
          MISSING=0
          while IFS= read -r file; do
            if ! grep -q "Copyright\|copyright\|LICENSE\|license\|Author\|author\|SPDX" "$file"; then
              echo "WARNING - MISSING HEADER: $file"
              MISSING=$((MISSING + 1))
            fi
          done < <(find "$PROJECT_DIR/Src" "$PROJECT_DIR/Inc" \
                        "$PROJECT_DIR/application/Src" "$PROJECT_DIR/application/Inc" \
                        \( -name "*.c" -o -name "*.h" \) 2>/dev/null)
          if [ "$MISSING" -gt 0 ]; then
            echo "---"
            echo "WARNING: $MISSING file(s) are missing copyright/header notice."
            echo "This is a warning only - build will continue."
          else
            echo "PASSED: All files have copyright/header notice."
          fi

      # ─── CHECK 2: DOXYGEN DOCUMENTATION CHECK (WARNING ONLY) ────────────────
      - name: Setup Doxyfile
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f Doxyfile ]; then
            echo "No Doxyfile found, generating default..."
            doxygen -g Doxyfile
            sed -i 's/PROJECT_NAME           = "My Project"/PROJECT_NAME           = "CnrMotorCnt"/' Doxyfile
            sed -i 's|INPUT                  =|INPUT                  = Src Inc application/Src application/Inc|' Doxyfile
            sed -i 's/RECURSIVE              = NO/RECURSIVE              = YES/' Doxyfile
            sed -i 's/EXTRACT_ALL            = NO/EXTRACT_ALL            = YES/' Doxyfile
          fi

      - name: Run Doxygen Check
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Running Doxygen..."
          doxygen Doxyfile 2>&1 | tee doxygen_output.log
          WARNINGS=$(grep -c "warning:" doxygen_output.log || true)
          echo "---"
          echo "Doxygen Warnings: $WARNINGS"
          if [ "$WARNINGS" -gt 0 ]; then
            echo "WARNING: $WARNINGS Doxygen warning(s) found - please review doxygen_output.log"
            echo "This is a warning only - build will continue."
          else
            echo "PASSED: No Doxygen warnings found."
          fi

      - name: Upload Doxygen Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stm32-doxygen-log
          path: ${{ env.PROJECT_DIR }}/doxygen_output.log
          retention-days: 7

      # ─── CHECK 3: SONARCLOUD SCAN ────────────────────────────────────────────
      # SonarCloud C analysis needs compile_commands.json (compiler flags + includes).
      # CMake configure alone creates it (CMAKE_EXPORT_COMPILE_COMMANDS is ON in CMakeLists.txt).
      - name: Generate compile_commands.json
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cmake --preset Debug
          test -f build/Debug/compile_commands.json

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ${{ env.PROJECT_DIR }}
          args: >
            -Dsonar.organization=patilprathmesh08
            -Dsonar.projectKey=patilprathmesh08_Testing
            -Dsonar.sources=Src,Inc,application
            -Dsonar.cfamily.compile-commands=build/Debug/compile_commands.json
            -Dsonar.exclusions=**/build/**,**/Drivers/**,**/Middlewares/**,**/MCSDK_v6.4.2-Full/**
            -Dsonar.qualitygate.wait=false
