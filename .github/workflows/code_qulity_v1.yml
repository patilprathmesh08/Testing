# ─────────────────────────────────────────────────────────────────────────────
# STM32 Motor Controller CI Pipeline
# Version: v8 (back to single job, all fixes + coverage consolidated)
# Date: 24-07-2026
#
# This is the single-job version. Everything discovered/fixed across the
# earlier two-job experiment is folded back in here:
#   - ARM GCC toolchain installed inside $GITHUB_WORKSPACE (not $HOME), so
#     it is visible to the SonarCloud action's Docker container
#   - compile_commands.json path-fix step rewrites BOTH the source paths
#     and the toolchain/compiler path (Sonar's analyzer invokes the
#     compiler directly during analysis, not just reads paths from JSON)
#   - sonar-project.properties lives inside CNR-Motor-Driver-1.0/, so the
#     SonarCloud Scan step passes projectBaseDir: CNR-Motor-Driver-1.0
#   - Host-side unit tests + code coverage (plain Unity + gcc --coverage +
#     gcovr) for motor_telemetry_math.c, a standalone duplicate of some
#     pure math also inline in main.c (main.c itself was NOT modified -
#     see motor_telemetry_math.c's file header for what that means)
#
# Since everything runs in ONE job now, there is no cross-job artifact
# upload/download needed for compile_commands.json or the coverage report -
# they're both already on disk when the SonarCloud Scan step runs later in
# the same job. Upload steps for them are kept anyway, purely so you can
# download and inspect either file manually from the Actions run UI.
# ─────────────────────────────────────────────────────────────────────────────

name: STM32 Motor Controller CI Pipeline

on:
  push:
    branches:
      - main
      - MotorCode
  pull_request:
    branches:
      - main
      - MotorCode

jobs:
  # ─── SINGLE JOB: BUILD + COVERAGE + CODE QUALITY ────────────────────────────
  build-and-analyze:
    name: Build and Analyze STM32G431
    runs-on: ubuntu-latest

    steps:
      # Step 1 - Checkout the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2 - Install ARM GCC 14.3.1 (same as local VS Code)
      # Extracted into $GITHUB_WORKSPACE (not $HOME) so the toolchain is
      # visible to the SonarCloud action's Docker container later on.
      - name: Install ARM GCC Toolchain 14.3.1
        run: |
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz
          tar xf arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz -C $GITHUB_WORKSPACE
          echo "$GITHUB_WORKSPACE/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi/bin" >> $GITHUB_PATH
          rm arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz

      # Step 3 - Verify ARM GCC version
      - name: Verify ARM GCC Version
        run: arm-none-eabi-gcc --version

      # Step 4 - Install Ninja
      - name: Install Ninja
        run: sudo apt-get install -y ninja-build

      # Step 5 - Install CMake
      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.27'

      # Step 6 - Install Doxygen
      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      # Step 7 - Install Sonar Build Wrapper
      # Mandatory for accurate C/C++ SonarCloud analysis
      - name: Install Sonar Build Wrapper
        run: |
          wget -q https://sonarcloud.io/static/cpp/build-wrapper-linux-x86.zip
          unzip -q build-wrapper-linux-x86.zip
          echo "$PWD/build-wrapper-linux-x86" >> $GITHUB_PATH
          rm build-wrapper-linux-x86.zip
          echo "Build Wrapper installed successfully"

      # Step 8 - Configure CMake Debug preset
      - name: Configure CMake (Debug)
        working-directory: CNR-Motor-Driver-1.0
        run: cmake --preset Debug

      # Step 9 - Build Debug firmware with Sonar Build Wrapper
      - name: Build Debug Firmware with Build Wrapper
        working-directory: CNR-Motor-Driver-1.0
        run: |
          build-wrapper-linux-x86-64 \
            --out-dir build-wrapper-output \
            cmake --build --preset Debug

      # Step 10 - Fix paths in compile_commands.json
      # Fixes TWO paths:
      #   1. Source path: runner checkout path -> container path
      #   2. Compiler/toolchain path: workspace-relative toolchain path ->
      #      container path (needed because compile_commands.json stores
      #      the absolute path to the arm-none-eabi-gcc binary, and that
      #      must also resolve inside the SonarCloud Docker container)
      - name: Fix Build Wrapper Paths for SonarCloud
        working-directory: CNR-Motor-Driver-1.0
        run: |
          sed -i 's|/home/runner/work/Testing/Testing/CNR-Motor-Driver-1.0|/github/workspace/CNR-Motor-Driver-1.0|g' \
            build-wrapper-output/compile_commands.json
          sed -i "s|$GITHUB_WORKSPACE/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi|/github/workspace/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi|g" \
            build-wrapper-output/compile_commands.json
          echo "Paths fixed successfully"
          head -3 build-wrapper-output/compile_commands.json

      # Step 10a - Upload compile_commands.json (for manual inspection only)
      - name: Upload compile_commands.json
        uses: actions/upload-artifact@v4
        with:
          name: compile-commands-json
          path: CNR-Motor-Driver-1.0/build-wrapper-output/compile_commands.json
          retention-days: 7

      # Step 11 - Configure CMake Release preset
      - name: Configure CMake (Release)
        working-directory: CNR-Motor-Driver-1.0
        run: cmake --preset Release

      # Step 12 - Build Release firmware
      - name: Build Release Firmware
        working-directory: CNR-Motor-Driver-1.0
        run: cmake --build --preset Release

      # Step 13 - Generate HEX and BIN files
      - name: Generate HEX and BIN Files
        working-directory: CNR-Motor-Driver-1.0
        run: |
          arm-none-eabi-objcopy -O ihex \
            $(find build/Release -name "*.elf" | head -1) \
            build/Release/firmware_release.hex
          arm-none-eabi-objcopy -O binary \
            $(find build/Release -name "*.elf" | head -1) \
            build/Release/firmware_release.bin
          echo "=== Generated Files ==="
          ls -la build/Release/*.hex build/Release/*.bin

      # Step 14 - Upload Release firmware artifacts
      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-release
          path: |
            CNR-Motor-Driver-1.0/build/Release/**/*.elf
            CNR-Motor-Driver-1.0/build/Release/*.hex
            CNR-Motor-Driver-1.0/build/Release/*.bin
          retention-days: 7

      # ─── UNIT TESTS + CODE COVERAGE (host-side) ─────────────────────────────
      # Tests motor_telemetry_math.c/.h under CNR-Motor-Driver-1.0/Src and
      # Inc. Runs on host gcc, not the ARM target, since there is no real
      # hardware on the CI runner. This module is a STANDALONE DUPLICATE of
      # some math also inline in main.c - main.c was not modified, so this
      # coverage reflects the duplicate, not main.c directly. See
      # motor_telemetry_math.c's file header for what that means in practice.
      - name: Install gcovr
        run: |
          sudo apt-get install -y gcovr
          gcovr --version

      - name: Fetch Unity Test Framework
        working-directory: CNR-Motor-Driver-1.0/unit_tests
        run: |
          git clone --depth 1 --branch v2.6.0 https://github.com/ThrowTheSwitch/Unity.git vendor/unity

      - name: Compile and Run Unit Tests with Coverage Instrumentation
        # Source and test files are compiled using ABSOLUTE paths. This
        # matters: gcov re-resolves each source file's location later from
        # the object file's own directory, not from the original compile
        # directory. A relative path like ../Src/foo.c resolves incorrectly
        # at that point - verified locally before landing this.
        working-directory: CNR-Motor-Driver-1.0/unit_tests
        run: |
          mkdir -p build
          SRC_ABS="$(cd .. && pwd)/Src/motor_telemetry_math.c"
          INC_ABS="$(cd .. && pwd)/Inc"
          TEST_ABS="$(pwd)/test/test_motor_telemetry_math.c"

          gcc -fprofile-arcs -ftest-coverage -I "$INC_ABS" -I vendor/unity/src \
            -c "$SRC_ABS" -o build/motor_telemetry_math.o
          gcc -fprofile-arcs -ftest-coverage -I "$INC_ABS" -I vendor/unity/src \
            -c "$TEST_ABS" -o build/test_motor_telemetry_math.o
          gcc -I vendor/unity/src \
            -c vendor/unity/src/unity.c -o build/unity.o
          gcc --coverage build/motor_telemetry_math.o build/test_motor_telemetry_math.o build/unity.o \
            -lm -o build/test_runner
          ./build/test_runner

      - name: Generate Coverage Report (SonarQube XML)
        # --root .. points gcovr at CNR-Motor-Driver-1.0 (the Sonar project
        # base dir), so file paths in the report come out as "Src/..." -
        # matching sonar.sources=Src exactly.
        # Filter is anchored (.*/Src/...$) to include ONLY the production
        # file, not the test file itself (which also ends in the same
        # "motor_telemetry_math.c" suffix - verified locally before
        # landing this, a loose filter matched both).
        working-directory: CNR-Motor-Driver-1.0/unit_tests
        run: |
          echo "== Full coverage summary (all compiled files) =="
          gcovr --root .. --object-directory build
          gcovr --root .. --filter '.*/Src/motor_telemetry_math\.c$' \
            --object-directory build --sonarqube build/coverage-sonarqube.xml
          echo "== Generated coverage report =="
          cat build/coverage-sonarqube.xml

      # Kept for manual download/inspection only - already on disk for the
      # SonarCloud Scan step later in this same job.
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-sonarqube-xml
          path: CNR-Motor-Driver-1.0/unit_tests/build/coverage-sonarqube.xml
          retention-days: 7

      # ─── CHECK 1: HEADER AND COPYRIGHT NOTICE (WARNING ONLY) ────────────────
      - name: Check File Headers and Copyright Notice
        run: |
          echo "Checking copyright headers in Src/ and Inc/ only..."
          MISSING=0
          while IFS= read -r file; do
            if ! grep -q "Copyright\|copyright\|LICENSE\|license\|Author\|author\|SPDX" "$file"; then
              echo "WARNING - MISSING HEADER: $file"
              MISSING=$((MISSING + 1))
            fi
          done < <(find CNR-Motor-Driver-1.0/Src CNR-Motor-Driver-1.0/Inc -name "*.c" -o -name "*.h" 2>/dev/null)
          if [ "$MISSING" -gt 0 ]; then
            echo "WARNING: $MISSING file(s) missing copyright/header notice."
            echo "This is a warning only - build will continue."
          else
            echo "PASSED: All files have copyright/header notice."
          fi

      # ─── CHECK 2: DOXYGEN HTML DOCUMENTATION (WARNING ONLY) ─────────────────
      - name: Run Doxygen
        working-directory: CNR-Motor-Driver-1.0
        run: |
          echo "Running Doxygen..."
          doxygen Doxyfile 2>&1 | tee doxygen_output.log
          WARNINGS=$(grep -c "warning:" doxygen_output.log || true)
          echo "Doxygen Warnings: $WARNINGS"
          if [ "$WARNINGS" -gt 0 ]; then
            echo "WARNING: $WARNINGS Doxygen warning(s) found."
          else
            echo "PASSED: No Doxygen warnings found."
          fi

      - name: Upload Doxygen HTML Documentation
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stm32-doxygen-docs
          path: CNR-Motor-Driver-1.0/docs/html/
          retention-days: 7

      # ─── DEBUG STEP: quick sanity check before Sonar runs ───────────────────
      - name: Debug Sonar Paths
        run: |
          echo "== Src folder check =="
          ls -la CNR-Motor-Driver-1.0/Src | head -5
          echo "== compile_commands.json sample =="
          head -c 500 CNR-Motor-Driver-1.0/build-wrapper-output/compile_commands.json
          echo ""
          echo "== Coverage report check =="
          ls -la CNR-Motor-Driver-1.0/unit_tests/build/coverage-sonarqube.xml

      # ─── CHECK 3: SONARCLOUD SCAN ────────────────────────────────────────────
      # projectBaseDir set since sonar-project.properties lives inside
      # CNR-Motor-Driver-1.0/, not the repo root.
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        with:
          projectBaseDir: CNR-Motor-Driver-1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
